<!DOCTYPE html>
<html>

<head>
    <title>Shopping cart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coiny&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="shoppingCart.css">
    <link rel="stylesheet" href="cats.css">

</head>

<body>
    <nav>
        <div class="container">
            <p class="logo"><a href="../index.html">BK CatStore</a></p>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="cats.html">Cats</a></li>
                <li><a href="owner.html">About us</a></li>
                <li><strong><a href="shoppingCart.html">Shopping cart</a></strong></li>
            </ul>
            <button class="hamburger" id="hamburger">&#9776;</button>
        </div>
    </nav>


    <main class="container">
        <div class="pageWrapper">
            <h1>Shopping cart</h1>
            <div class="cartGrid">
                <div id="cartGrid" style="display:contents"></div>
            </div>

            <h2>Add order</h2>
            <div class="formCard">
                <form class="orderForm">
                    <div class="formRow">
                        <label>Name</label>
                        <input class="orderFormBar" type="text" id="name" placeholder="Your name...">
                    </div>
                    <div class="formRow">
                        <label>Email</label>
                        <input class="orderFormBar" type="email" id="email" placeholder="Your email...">
                    </div>
                    <div class="formRow">
                        <label>Address</label>
                        <input class="orderFormBar" type="text" id="address" placeholder="The delivery address...">
                    </div>

                    <button class="submitBtn" type="submit">Send order</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        document.getElementById("hamburger").addEventListener("click", () => {
            document.querySelector("nav ul").classList.toggle("open");
        });
    </script>
    <script src="shoppingCart.js"></script>

</body>

</html>
